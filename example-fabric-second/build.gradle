plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

loom{
    accessWidenerPath = file("src/main/resources/muffins_oven_api_secondtest.classtweaker")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    if(project.recipe_overlay == "jei"){
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${project.jei_version}")
    }else if(project.recipe_overlay =="emi"){
        modImplementation("dev.emi:emi-fabric:${project.emi_version}")
    }

    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    implementation project(path: ":fabric", configuration: "namedElements")
    common(project(path: ":common", configuration: "namedElements")) { transitive false }

    //common(project(path: ':example:common', configuration: 'namedElements')) { transitive false }

    //common(project(path:":example-common",configuration: "namedElements"))
    //implementation(project(path:":example-fabric",configuration: "namedElements"))
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filteringCharset "UTF-8"

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version : project.minecraft_version
    }
}

shadowJar {
    exclude "architectury.common.json"
    exclude "META-INF"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":example-common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}