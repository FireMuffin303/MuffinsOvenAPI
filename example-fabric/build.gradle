plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

loom{
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    if(project.recipe_overlay == "jei"){
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${project.jei_version}")
    }else if(project.recipe_overlay =="emi"){
        modImplementation("dev.emi:emi-fabric:${project.emi_version}")
    }

    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    implementation project(path: ":fabric", configuration: "namedElements")
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    common(project(path: ":example-common", configuration: "namedElements")) { transitive false }

    //common(project(path: ':example:common', configuration: 'namedElements')) { transitive false }
    //shadowBundle project(path: ':example:common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filteringCharset "UTF-8"

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version : project.minecraft_version
    }
}